name: Offline risk review
on:
  push:
    branches: ["fix/gate-trend-risk-20260905"]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: risk-review-source
          retention-days: 1
          path: |
            scripts/*.py
            trading/
            tests/
            docs/
