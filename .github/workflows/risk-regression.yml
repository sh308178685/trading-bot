name: Offline risk regression
on:
  push:
    branches: ["fix/gate-trend-risk-20260905"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pandas==2.2.3 ccxt websocket-client
      - name: Compile and run offline tests (never start the bot)
        run: |
          set -o pipefail
          python -m compileall -q scripts trading tests
          python -m unittest discover -s tests -v 2>&1 | tee risk-tests.txt
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-regression-results
          retention-days: 7
          path: risk-tests.txt
